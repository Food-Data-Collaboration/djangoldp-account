---
image: python:3.11

include:
  project: infra/gitlab
  ref: master
  file: templates/python.ci.yml

test:
  stage: test
  script:
    - pip install .[dev]
    - python -m unittest djangoldp_account.tests.runner
  except:
    - master
    - tags
  tags:
    - test

publish:
  cache: []
  extends: .publish_pypi
